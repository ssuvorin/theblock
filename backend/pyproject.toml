[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "second-brain-crm-backend"
version = "0.1.0"
description = "Demo-critical Second Brain CRM API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pydantic==2.13.5",
  "pydantic-settings==2.10.1",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
